name: Rebuild Daily Prophet

on:
  schedule:
    # 每小时第 17 分钟投递一次（UTC）
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rebuild-prophet
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 印刷今天的魔法日报
        run: node build.js

      - name: 提交并推送
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "📰 投递魔法日报 $(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M')"
          git push
